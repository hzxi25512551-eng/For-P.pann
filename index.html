<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กระดานให้คะแนนทีม</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sarabun:wght@400;500;600&display=swap');

  :root{
    --bg-deep: #0a0f1c;
    --bg: #0e1626;
    --panel: #182238;
    --panel-2: #1e2a45;
    --line: #2a3853;
    --gold: #e8b34c;
    --gold-dim: #a67c2f;
    --off: #4a5a7a;
    --off-fill: #26314a;
    --text: #eef1f6;
    --text-dim: #90a0bf;
    --danger: #d9634f;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #142038 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    padding: 24px 20px 60px;
  }

  .wrap{ max-width: 100%; margin: 0 auto; }

  header{
    text-align:center;
    margin-bottom: 22px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing: 0.35em;
    font-size: clamp(10px, 1vw, 13px);
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 3.4vw, 46px);
    letter-spacing: 0.02em;
    margin: 0;
    color: #fff;
  }

  .add-panel{
    max-width: 620px;
    margin: 20px auto 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    gap: 10px;
  }
  .add-panel input{
    flex: 1;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s;
  }
  .add-panel input:focus{ border-color: var(--gold); }
  .add-panel input::placeholder{ color: var(--text-dim); }

  .add-panel button{
    background: var(--gold);
    color: #1a1306;
    border: none;
    border-radius: 6px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.03em;
    padding: 0 24px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
    white-space: nowrap;
  }
  .add-panel button:hover{ filter: brightness(1.1); }
  .add-panel button:active{ transform: scale(0.97); }

  .board-scroll{
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }

  table.board{
    border-collapse: collapse;
    width: 100%;
    min-width: 1100px;
  }

  .board thead th{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(14px, 1.3vw, 20px);
    color: var(--gold);
    background: var(--panel-2);
    border-bottom: 2px solid var(--gold-dim);
    padding: 14px 4px;
    text-align: center;
    position: sticky;
    top: 0;
  }
  .board thead th.team-col{
    text-align: left;
    padding-left: 20px;
    min-width: 220px;
  }
  .board thead th.total-col{
    min-width: 110px;
  }
  .board thead th.del-col{
    min-width: 46px;
  }

  .board tbody tr{
    border-bottom: 1px solid var(--line);
  }
  .board tbody tr:last-child{ border-bottom: none; }
  .board tbody tr:hover{ background: rgba(232,179,76,0.04); }

  .team-cell{
    padding: 10px 20px;
  }
  .team-name{
    width: 100%;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(18px, 1.8vw, 26px);
    font-weight: 600;
    color: #fff;
    background: transparent;
    border: none;
    outline: none;
    padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .team-name:focus{ border-bottom: 1px dashed var(--gold); }

  .chk-cell{
    text-align: center;
    padding: 8px 4px;
  }
  .chk-box{
    width: clamp(30px, 2.6vw, 44px);
    height: clamp(30px, 2.6vw, 44px);
    margin: 0 auto;
    border-radius: 8px;
    border: 2px solid var(--off);
    background: var(--off-fill);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 1.6vw, 24px);
    color: transparent;
    transition: all .12s ease;
    user-select: none;
  }
  .chk-box.on{
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1306;
    font-weight: 700;
  }
  .chk-box:hover{ border-color: var(--gold-dim); }

  .total-cell{
    text-align: center;
    padding: 8px 4px;
  }
  .score-num{
    display: inline-block;
    min-width: 2.4em;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(22px, 2.2vw, 34px);
    font-weight: 700;
    color: var(--gold);
    background: var(--bg-deep);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 4px 10px;
  }

  .del-cell{
    text-align: center;
    padding: 8px;
  }
  .remove-btn{
    background: none;
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: border-color .15s, color .15s;
  }
  .remove-btn:hover{ border-color: var(--danger); color: var(--danger); }

  .empty-row td{
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 15px;
  }

  .summary{
    max-width: 1100px;
    margin: 22px auto 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(12px, 1vw, 15px);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">15 ข้อ · ติ๊กถูก · รวมคะแนนอัตโนมัติ</div>
    <h1>กระดานให้คะแนนทีม</h1>
  </header>

  <div class="add-panel">
    <input id="teamNameInput" type="text" placeholder="ชื่อทีม เช่น ทีม A" maxlength="40" />
    <button id="addTeamBtn">+ เพิ่มทีม</button>
  </div>

  <div class="board-scroll">
    <table class="board">
      <thead>
        <tr id="headerRow">
          <th class="team-col">ทีม</th>
          <th class="total-col">รวม</th>
          <th class="del-col"></th>
        </tr>
      </thead>
      <tbody id="teamsBody"></tbody>
    </table>
  </div>

  <div class="summary" id="summaryBar" style="display:none;">
    <span id="teamCountLabel"></span>
    <span id="grandTotalLabel"></span>
  </div>
</div>

<script>
  const QUESTIONS = 15;
  let teams = [];
  let nextId = 1;

  const headerRow = document.getElementById('headerRow');
  const tbody = document.getElementById('teamsBody');
  const nameInput = document.getElementById('teamNameInput');
  const addBtn = document.getElementById('addTeamBtn');
  const summaryBar = document.getElementById('summaryBar');
  const teamCountLabel = document.getElementById('teamCountLabel');
  const grandTotalLabel = document.getElementById('grandTotalLabel');

  const totalTh = headerRow.querySelector('.total-col');
  for(let i = 1; i <= QUESTIONS; i++){
    const th = document.createElement('th');
    th.textContent = i;
    headerRow.insertBefore(th, totalTh);
  }

  function addTeam(name){
    const trimmed = (name || '').trim() || `ทีม ${teams.length + 1}`;
    teams.push({
      id: nextId++,
      name: trimmed,
      checks: Array(QUESTIONS).fill(false)
    });
    render();
  }

  function removeTeam(id){
    teams = teams.filter(t => t.id !== id);
    render();
  }

  function toggleCheck(teamId, idx){
    const team = teams.find(t => t.id === teamId);
    if(!team) return;
    team.checks[idx] = !team.checks[idx];
    render();
  }

  function renameTeam(teamId, newName){
    const team = teams.find(t => t.id === teamId);
    if(!team) return;
    team.name = newName.trim() || team.name;
  }

  function scoreOf(team){
    return team.checks.filter(Boolean).length;
  }

  function render(){
    tbody.innerHTML = '';

    if(teams.length === 0){
      const tr = document.createElement('tr');
      tr.className = 'empty-row';
      const td = document.createElement('td');
      td.colSpan = QUESTIONS + 3;
      td.textContent = 'ยังไม่มีทีม — เพิ่มทีมแรกได้เลย';
      tr.appendChild(td);
      tbody.appendChild(tr);
      summaryBar.style.display = 'none';
      return;
    }

    teams.forEach(team => {
      const tr = document.createElement('tr');

      const teamTd = document.createElement('td');
      teamTd.className = 'team-cell';
      const nameEl = document.createElement('input');
      nameEl.className = 'team-name';
      nameEl.value = team.name;
      nameEl.addEventListener('change', e => renameTeam(team.id, e.target.value));
      teamTd.appendChild(nameEl);
      tr.appendChild(teamTd);

      team.checks.forEach((checked, idx) => {
        const td = document.createElement('td');
        td.className = 'chk-cell';
        const box = document.createElement('div');
        box.className = 'chk-box' + (checked ? ' on' : '');
        box.textContent = '✓';
        box.addEventListener('click', () => toggleCheck(team.id, idx));
        td.appendChild(box);
        tr.appendChild(td);
      });

      const totalTd = document.createElement('td');
      totalTd.className = 'total-cell';
      const scoreEl = document.createElement('span');
      scoreEl.className = 'score-num';
      scoreEl.textContent = scoreOf(team);
      totalTd.appendChild(scoreEl);
      tr.appendChild(totalTd);

      const delTd = document.createElement('td');
      delTd.className = 'del-cell';
      const removeEl = document.createElement('button');
      removeEl.className = 'remove-btn';
      removeEl.textContent = '✕';
      removeEl.title = 'ลบทีมนี้';
      removeEl.addEventListener('click', () => removeTeam(team.id));
      delTd.appendChild(removeEl);
      tr.appendChild(delTd);

      tbody.appendChild(tr);
    });

    const grandTotal = teams.reduce((sum, t) => sum + scoreOf(t), 0);
    teamCountLabel.textContent = `ทีมทั้งหมด ${teams.length} ทีม`;
    grandTotalLabel.textContent = `คะแนนรวมทุกทีม ${grandTotal} คะแนน`;
    summaryBar.style.display = 'flex';
  }

  addBtn.addEventListener('click', () => {
    addTeam(nameInput.value);
    nameInput.value = '';
    nameInput.focus();
  });

  nameInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      addTeam(nameInput.value);
      nameInput.value = '';
    }
  });

  addTeam('ทีม 1');
  addTeam('ทีม 2');
</script>
</body>
</html>
